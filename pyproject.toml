[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medialoop"
version = "0.1.0"
description = "Closed-loop in-vitro media search against a synthetic surface."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Dylan Stechmann"}]
dependencies = [
  "numpy",
]

[project.scripts]
medialoop = "medialoop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
